// Dynamic node_modules resolution for both standalone CI and monorepo environments
def resolveNodeModulesPath(String subPath) {
    def localPath = new File('../node_modules/' + subPath)
    if (localPath.exists()) {
        return localPath
    }
    return new File('../../node_modules/' + subPath)
}

include ':capacitor-android'
project(':capacitor-android').projectDir = resolveNodeModulesPath('@capacitor/android/capacitor')

include ':capacitor-app'
project(':capacitor-app').projectDir = resolveNodeModulesPath('@capacitor/app/android')

include ':capacitor-haptics'
project(':capacitor-haptics').projectDir = resolveNodeModulesPath('@capacitor/haptics/android')

include ':capacitor-keyboard'
project(':capacitor-keyboard').projectDir = resolveNodeModulesPath('@capacitor/keyboard/android')

include ':capacitor-share'
project(':capacitor-share').projectDir = resolveNodeModulesPath('@capacitor/share/android')

include ':capacitor-splash-screen'
project(':capacitor-splash-screen').projectDir = resolveNodeModulesPath('@capacitor/splash-screen/android')

include ':capacitor-status-bar'
project(':capacitor-status-bar').projectDir = resolveNodeModulesPath('@capacitor/status-bar/android')
