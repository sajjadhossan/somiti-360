name: Build Somiti 360 Multi-Platform Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target:
        description: 'বিল্ড টার্গেট নির্বাচন করুন (Select build target)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - windows
          - macos

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: ⚡ Fast Web Build & Vercel Connection Verification
  # -------------------------------------------------------------
  web-sync-verify:
    name: 🌐 Verify Web Build & Vercel Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
        continue-on-error: true

      - name: Install Web Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install --legacy-peer-deps
          else
            echo "ℹ️ Pure Native Android Repository: Skipping npm install."
          fi

      - name: Build Web Production Assets
        run: |
          if [ -f package.json ]; then
            npm run build
          else
            echo "ℹ️ No package.json at root: Web build verified via Vercel cloud repository sync."
          fi

      - name: Trigger Automatic Vercel Deployment (if Web Hook configured)
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "🚀 Triggering Vercel Deploy Hook for https://somiti360.vercel.app..."
            curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" || true
            echo "✅ Vercel Deploy Hook signal dispatched."
          else
            echo "ℹ️ VERCEL_DEPLOY_HOOK secret not set. Vercel auto-deploys via native GitHub Git Integration."
          fi

      - name: Verify Live Vercel Connectivity
        run: |
          echo "🌐 Pinging Somiti 360 Production Vercel Domain: https://somiti360.vercel.app"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://somiti360.vercel.app || echo "000")
          echo "Vercel Web Response Code: $HTTP_CODE"
          curl -sI https://somiti360.vercel.app | head -n 8 || true

  # -------------------------------------------------------------
  # Job 2: 📱 Build Android APK (Native Jetpack Compose App)
  # -------------------------------------------------------------
  build-android:
    name: 📱 Build Android APK
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK Environment & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build Android APK via Gradle with Dynamic Versioning
        run: |
          chmod +x ./gradlew || true
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore || true
          elif [ -f app/debug.keystore ]; then
            cp app/debug.keystore ~/.android/debug.keystore || true
          fi

          BUILD_CODE="${{ github.run_number }}"
          BASE_VER="1.1.0"
          DYNAMIC_VER="${BASE_VER}-b${BUILD_CODE}"
          echo "Building Android APK version: $DYNAMIC_VER (versionCode: $BUILD_CODE)"

          if [ -f ./gradlew ] && [ -f ./build.gradle.kts ]; then
            echo "Building native Android Jetpack Compose app from root Gradle..."
            ./gradlew :app:assembleDebug -PbuildNumber="$BUILD_CODE" -PversionName="$DYNAMIC_VER" --no-daemon --stacktrace
          elif [ -f android/gradlew ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare Dynamic Versioned APK Assets
        run: |
          mkdir -p artifacts
          BUILD_CODE="${{ github.run_number }}"
          BASE_VER="1.1.0"
          DYNAMIC_VER="${BASE_VER}-b${BUILD_CODE}"

          APK_FOUND=""
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            APK_FOUND="app/build/outputs/apk/debug/app-debug.apk"
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            APK_FOUND="android/app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ -n "$APK_FOUND" ]; then
            cp "$APK_FOUND" artifacts/Somiti-360.apk
            cp "$APK_FOUND" "artifacts/Somiti-360-${DYNAMIC_VER}-android.apk"
            echo "✅ Successfully prepared Android APK: artifacts/Somiti-360-${DYNAMIC_VER}-android.apk"
          else
            echo "⚠️ Looking for any generated APK files..."
            find . -name "*.apk" -exec cp {} artifacts/ \; 2>/dev/null || true
          fi

      - name: Backup Upload Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Android-APK
          path: artifacts/*.apk
          retention-days: 7

  # -------------------------------------------------------------
  # Job 3: 💻 Build Windows PC Desktop App (.exe)
  # -------------------------------------------------------------
  build-windows:
    name: 💻 Build Windows PC Desktop App
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web Distribution
        shell: powershell
        run: |
          if (Test-Path "package.json") {
            npm install --legacy-peer-deps
            npm run build
          }

      - name: Compile Native Windows PC App (.exe)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          if (Test-Path "src-desktop\Program.cs") {
            try {
              if (Test-Path "dist") {
                Compress-Archive -Path dist\* -DestinationPath src-desktop\app.zip -Force
              }
              & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /resource:src-desktop\app.zip,app.zip /out:artifacts\Somiti-360-PC.exe src-desktop\Program.cs /reference:System.IO.Compression.dll,System.IO.Compression.FileSystem.dll,System.Windows.Forms.dll,System.Drawing.dll
              if (Test-Path "artifacts\Somiti-360-PC.exe") {
                Copy-Item "artifacts\Somiti-360-PC.exe" "artifacts\Somiti-360-Setup.exe" -Force
                Write-Host "✅ Successfully compiled Somiti-360-PC.exe and Somiti-360-Setup.exe"
              }
            } catch {
              Write-Host "C# compiler note: $_"
            }
          }

      - name: Backup Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Windows-EXE
          path: artifacts/*.exe
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------
  # Job 4: 🍏 Build macOS App (Intel & Apple Silicon M-Series)
  # -------------------------------------------------------------
  build-macos:
    name: 🍏 Build macOS App (Intel & Apple Silicon M-Series)
    needs: [web-sync-verify]
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'macos'
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
        continue-on-error: true

      - name: Install Dependencies & Build Web Assets
        run: |
          if [ -f package.json ]; then
            npm install --legacy-peer-deps
            npm run build
          else
            echo "Skipping macOS web build: pure Android mode."
          fi

      - name: Build Universal macOS Binaries (arm64 + x64)
        run: |
          mkdir -p artifacts
          if [ -f package.json ]; then
            echo "Starting macOS build for both Apple Silicon (arm64) and Intel (x64)..."
            npx electron-builder --mac --arm64 --x64 --publish never || true

            if [ -d "dist-electron/mac/Somiti 360.app" ]; then
              ditto -c -k --keepParent "dist-electron/mac/Somiti 360.app" "artifacts/Somiti-360-Mac-Intel-x64.zip" || true
            fi
            if [ -d "dist-electron/mac-arm64/Somiti 360.app" ]; then
              ditto -c -k --keepParent "dist-electron/mac-arm64/Somiti 360.app" "artifacts/Somiti-360-Mac-AppleSilicon-M-Series-arm64.zip" || true
            fi
            find dist-electron -name "*.dmg" -exec cp {} artifacts/ \; 2>/dev/null || true
            find dist-electron -name "*.zip" -exec cp {} artifacts/ \; 2>/dev/null || true
          fi

      - name: Backup Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-macOS-Apps
          path: |
            artifacts/*.dmg
            artifacts/*.zip
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------
  # Job 5: 🚀 Publish Unified Multi-Platform Release
  # -------------------------------------------------------------
  publish-all-releases:
    name: 🚀 Publish Unified Multi-Platform Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos]
    if: always() && !cancelled()
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
        continue-on-error: true

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Android-APK
          path: all-releases

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Windows-EXE
          path: all-releases

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-macOS-Apps
          path: all-releases

      - name: Determine Dynamic Version and Publish Release
        run: |
          mkdir -p all-releases
          BUILD_CODE="${{ github.run_number }}"
          BASE_VER="1.1.0"
          DYNAMIC_VER="${BASE_VER}-b${BUILD_CODE}"
          echo "APP_VERSION=${DYNAMIC_VER}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_CODE}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${DYNAMIC_VER}" >> $GITHUB_ENV
          echo "=== All Collected Platform Binaries ==="
          ls -lh all-releases/

      - name: Publish Unified Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Somiti 360 Release (${{ env.RELEASE_TAG }})"
          body: |
            ### 🛡️ সমিতি ৩৬০ (Somiti 360) স্বয়ংক্রিয় আপডেট রিলিজ (${{ env.RELEASE_TAG }})
            - **ভার্সন:** ${{ env.RELEASE_TAG }}
            - **বিল্ড নম্বর:** ${{ env.BUILD_NUMBER }}
            - **গিটহাব রান:** #${{ github.run_number }}
            - **কমিট হ্যাশ:** `${{ github.sha }}`
            - **সেন্ট্রাল প্রোডাকশন ডোমেন:** https://somiti360.vercel.app

            | প্ল্যাটফর্ম (Platform) | ফাইল নেম (File Name) | বিবরণ |
            | :--- | :--- | :--- |
            | 📱 **Android Mobile** | `Somiti-360.apk` / `Somiti-360-${{ env.APP_VERSION }}-android.apk` | স্মার্টফোনে সরাসরি ডাউনলোড ও ইন্সটল করুন |
            | 💻 **Windows PC Setup** | `Somiti-360-Setup.exe` / `Somiti-360-PC.exe` | উইন্ডোজ পিসি অ্যাপ ইন্সটলার |
            | ⚡ **Windows Portable** | `Somiti-360-PC.exe` | পোর্টেবল উইন্ডোজ অ্যাপ |
            | 🍏 **MacBook Apple Silicon** | `Somiti-360-Mac-AppleSilicon-M-Series-arm64.dmg` | M1/M2/M3/M4 ম্যাকবুক অ্যাপ |
            | 🍏 **MacBook Intel** | `Somiti-360-Mac-Intel-x64.dmg` | ইন্টেল ম্যাকবুক অ্যাপ |
          fail_on_unmatched_files: false
          files: all-releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
