name: Somiti 360 Multi-Platform Build & Vercel Sync

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target:
        description: 'বিল্ড টার্গেট নির্বাচন করুন (Select build target)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - windows
          - vercel

permissions:
  contents: write
  packages: write
  actions: write

env:
  APP_NAME: "Somiti 360"
  BASE_VERSION: "1.1.0"
  VERCEL_URL: "https://somiti360.vercel.app"

jobs:
  # -------------------------------------------------------------
  # Job 1: 🌐 Fast Web Build & Vercel Continuous Deployment Sync
  # -------------------------------------------------------------
  vercel-sync-verify:
    name: 🌐 Verify Web Build & Vercel Sync
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'vercel'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
        continue-on-error: true

      - name: Install Web Dependencies
        run: |
          if [ -f package.json ]; then
            npm install --legacy-peer-deps
          fi

      - name: Build Web Production Assets (dist/)
        run: |
          if [ -f package.json ]; then
            npm run build
          fi

      - name: Deploy to Vercel (CLI or Deploy Hook)
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "🚀 Deploying to Vercel via Vercel CLI..."
            npx vercel --prod --token="${{ secrets.VERCEL_TOKEN }}" --yes || true
            echo "✅ Vercel CLI production deployment dispatched."
          elif [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "🚀 Triggering Vercel Deploy Hook for ${{ env.VERCEL_URL }}..."
            curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" || true
            echo "✅ Vercel Deploy Hook signal dispatched."
          else
            echo "ℹ️ VERCEL_DEPLOY_HOOK / VERCEL_TOKEN secret not set. Vercel auto-deploys via native GitHub Git Integration."
          fi

      - name: Verify Live Vercel Connectivity
        run: |
          echo "🌐 Testing live connectivity for Somiti 360 Production Vercel Domain: ${{ env.VERCEL_URL }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.VERCEL_URL }}" || echo "000")
          echo "Vercel Web Response Status Code: $HTTP_CODE"
          curl -sI "${{ env.VERCEL_URL }}" | head -n 8 || true

  # -------------------------------------------------------------
  # Job 2: 📱 Build Android APK (Native Jetpack Compose App)
  # -------------------------------------------------------------
  build-android:
    name: 📱 Build Android APK
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses & Ensure Build-Tools
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Configure Keystore Compatibility
        run: |
          mkdir -p ~/.android
          # Guarantee debug.keystore is present at project root, app/ module, and ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true
            cp debug.keystore app/debug.keystore 2>/dev/null || true
          elif [ -f app/debug.keystore ]; then
            cp app/debug.keystore debug.keystore 2>/dev/null || true
            cp app/debug.keystore ~/.android/debug.keystore 2>/dev/null || true
          elif [ -f ~/.android/debug.keystore ]; then
            cp ~/.android/debug.keystore debug.keystore 2>/dev/null || true
            cp ~/.android/debug.keystore app/debug.keystore 2>/dev/null || true
          else
            echo "⚡ Creating verified debug.keystore for automated CI build..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true
            cp debug.keystore app/debug.keystore 2>/dev/null || true
          fi
          echo "Verified Keystores:"
          ls -la debug.keystore app/debug.keystore ~/.android/debug.keystore 2>/dev/null || true

      - name: Build Android APK via Gradle with Incremental Versioning
        run: |
          chmod +x ./gradlew
          BUILD_CODE="${{ github.run_number }}"
          DYNAMIC_VER="${{ env.BASE_VERSION }}-b${BUILD_CODE}"
          echo "=================================================="
          echo "Building Somiti 360 APK version: $DYNAMIC_VER"
          echo "Build Number (versionCode): $BUILD_CODE"
          echo "=================================================="

          ./gradlew :app:assembleDebug -PbuildNumber="$BUILD_CODE" -PversionName="$DYNAMIC_VER" --no-daemon --stacktrace

      - name: Prepare Dynamic Versioned APK Assets
        run: |
          mkdir -p artifacts
          BUILD_CODE="${{ github.run_number }}"
          DYNAMIC_VER="${{ env.BASE_VERSION }}-b${BUILD_CODE}"

          echo "Searching for generated APK files..."
          find . -name "*.apk" -type f

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/Somiti-360.apk
            cp app/build/outputs/apk/debug/app-debug.apk "artifacts/Somiti-360-${DYNAMIC_VER}-android.apk"
            echo "✅ Successfully copied APK to artifacts/Somiti-360-${DYNAMIC_VER}-android.apk"
          else
            FIRST_APK=$(find . -name "*debug*.apk" -type f | head -n 1)
            if [ -n "$FIRST_APK" ]; then
              cp "$FIRST_APK" artifacts/Somiti-360.apk
              cp "$FIRST_APK" "artifacts/Somiti-360-${DYNAMIC_VER}-android.apk"
              echo "✅ Fallback: copied $FIRST_APK to artifacts/Somiti-360.apk"
            fi
          fi

          ls -lh artifacts/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Somiti-360-Android-APK
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 14

  # -------------------------------------------------------------
  # Job 3: 💻 Build Windows PC Desktop App (.exe)
  # -------------------------------------------------------------
  build-windows:
    name: 💻 Build Windows PC Desktop App
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web Distribution
        shell: powershell
        run: |
          if (Test-Path "package.json") {
            npm install --legacy-peer-deps
            npm run build
          }

      - name: Compile Native Windows PC App (.exe)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          New-Item -ItemType Directory -Force -Path src-desktop

          # Ensure app.zip exists for embedding
          if (Test-Path "dist") {
            Compress-Archive -Path dist\* -DestinationPath src-desktop\app.zip -Force
          } elseif (-not (Test-Path "src-desktop\app.zip")) {
            New-Item -ItemType File -Path src-desktop\app.zip -Force
          }

          if (Test-Path "src-desktop\Program.cs") {
            try {
              $cscPath = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
              if (-not (Test-Path $cscPath)) {
                $cscPath = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
              }
              Write-Host "Compiling with $cscPath..."
              & $cscPath /target:winexe /resource:src-desktop\app.zip,app.zip /out:artifacts\Somiti-360-PC.exe src-desktop\Program.cs /reference:System.IO.Compression.dll,System.IO.Compression.FileSystem.dll,System.Windows.Forms.dll,System.Drawing.dll
              if (Test-Path "artifacts\Somiti-360-PC.exe") {
                Copy-Item "artifacts\Somiti-360-PC.exe" "artifacts\Somiti-360-Setup.exe" -Force
                Write-Host "✅ Successfully compiled Somiti-360-PC.exe and Somiti-360-Setup.exe"
              }
            } catch {
              Write-Host "Windows compilation note: $_"
            }
          }

      - name: Upload Windows PC Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Windows-EXE
          path: artifacts/*.exe
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------
  # Job 4: 🚀 Publish Unified Multi-Platform Release
  # -------------------------------------------------------------
  publish-all-releases:
    name: 🚀 Publish Unified Multi-Platform Release
    runs-on: ubuntu-latest
    needs: [build-android]
    if: always() && !cancelled()
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Android-APK
          path: all-releases

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Windows-EXE
          path: all-releases

      - name: Determine Dynamic Version and Prepare Release Folder
        run: |
          mkdir -p all-releases
          BUILD_CODE="${{ github.run_number }}"
          DYNAMIC_VER="${{ env.BASE_VERSION }}-b${BUILD_CODE}"
          echo "APP_VERSION=${DYNAMIC_VER}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_CODE}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${DYNAMIC_VER}" >> $GITHUB_ENV
          echo "=== All Collected Platform Binaries ==="
          ls -lh all-releases/

      - name: Publish Unified Release to GitHub
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Somiti 360 Release (${{ env.RELEASE_TAG }})"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### 🛡️ সমিতি ৩৬০ (Somiti 360) স্বয়ংক্রিয় ক্লাউড রিলিজ (${{ env.RELEASE_TAG }})
            - **ভার্সন:** `${{ env.RELEASE_TAG }}`
            - **বিল্ড নম্বর:** `${{ env.BUILD_NUMBER }}`
            - **গিটহাব অ্যাকশনস রান:** `#${{ github.run_number }}`
            - **কমিট হ্যাশ:** `${{ github.sha }}`
            - **ভার্সেল প্রোডাকশন ডোমেন:** [${{ env.VERCEL_URL }}](${{ env.VERCEL_URL }})
            - **ক্লাউড সিঙ্ক:** ফায়ারস্টোর লাইভ ডাটাবেস সক্রিয় ⚡

            | প্ল্যাটফর্ম (Platform) | ফাইল নেম (File Name) | বিবরণ |
            | :--- | :--- | :--- |
            | 📱 **Android Mobile** | `Somiti-360.apk` / `Somiti-360-${{ env.APP_VERSION }}-android.apk` | স্মার্টফোনে সরাসরি ডাউনলোড ও আপডেট করুন (আগের অ্যাপ আনইনস্টল করা লাগবে না) |
            | 💻 **Windows PC Setup** | `Somiti-360-Setup.exe` / `Somiti-360-PC.exe` | উইন্ডোজ পিসি অ্যাপ ইন্সটলার ও পোর্টেবল অ্যাপ |

            > **আপডেট সহায়িকা:** আপনার ফোনে অ্যাপটি ইতিমধ্যে ইনস্টল করা থাকলে আগের অ্যাপ ডিলিট না করেই সরাসরি নতুন APK ফাইল ইনস্টল করলে অ্যাপ অটো-আপডেট হয়ে যাবে এবং কোনো অফলাইন ডাটা হারাবে না।
          fail_on_unmatched_files: false
          files: all-releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
