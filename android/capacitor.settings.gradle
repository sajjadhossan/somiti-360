// Dynamic node_modules resolution for both Monorepo and standalone GitHub Actions runners
def resolvePluginDir(String pluginSubpath) {
    File f1 = new File(rootDir, '../../node_modules/' + pluginSubpath)
    if (f1.exists()) return f1
    File f2 = new File(rootDir, '../node_modules/' + pluginSubpath)
    if (f2.exists()) return f2
    File f3 = new File(rootDir, 'node_modules/' + pluginSubpath)
    if (f3.exists()) return f3
    return f2
}

include ':capacitor-android'
project(':capacitor-android').projectDir = resolvePluginDir('@capacitor/android/capacitor')

include ':capacitor-app'
project(':capacitor-app').projectDir = resolvePluginDir('@capacitor/app/android')

include ':capacitor-haptics'
project(':capacitor-haptics').projectDir = resolvePluginDir('@capacitor/haptics/android')

include ':capacitor-keyboard'
project(':capacitor-keyboard').projectDir = resolvePluginDir('@capacitor/keyboard/android')

include ':capacitor-share'
project(':capacitor-share').projectDir = resolvePluginDir('@capacitor/share/android')

include ':capacitor-splash-screen'
project(':capacitor-splash-screen').projectDir = resolvePluginDir('@capacitor/splash-screen/android')

include ':capacitor-status-bar'
project(':capacitor-status-bar').projectDir = resolvePluginDir('@capacitor/status-bar/android')
