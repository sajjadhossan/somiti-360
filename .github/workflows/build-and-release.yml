name: Build Somiti 360 Multi-Platform Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK 36 Platform
        run: |
          echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" || true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Copy Web Assets into Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/
          chmod +x android/gradlew
          mkdir -p ~/.android
          cp android/app/debug.keystore ~/.android/debug.keystore || true
          sed -i 's|\.\./\.\./node_modules|\.\./node_modules|g' android/capacitor.settings.gradle || true

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle_build.log 2>&1 || (tail -n 60 gradle_build.log && exit 1)

      - name: Prepare APK Asset
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Somiti-360.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Somiti-360-v2.2.0-build22-android.apk

      - name: Backup Upload Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Android-APK
          path: |
            artifacts/Somiti-360.apk
            artifacts/Somiti-360-v2.2.0-build22-android.apk
          retention-days: 7

  build-windows:
    name: 💻 Build Windows PC Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Package Native Windows Electron App & Launcher
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          try {
            npx electron-builder --win --publish never
            if (Test-Path "dist-electron\*.exe") {
              Copy-Item "dist-electron\*.exe" "artifacts\Somiti-360-Setup.exe" -Force
            }
          } catch {
            Write-Host "Electron builder fallback"
          }
          Compress-Archive -Path dist\* -DestinationPath src-desktop\app.zip -Force
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /resource:src-desktop\app.zip,app.zip /out:artifacts\Somiti-360-PC.exe src-desktop\Program.cs /reference:System.IO.Compression.dll,System.IO.Compression.FileSystem.dll,System.Windows.Forms.dll,System.Drawing.dll

      - name: Backup Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Windows-EXE
          path: artifacts/*.exe
          retention-days: 7

  build-macos:
    name: 🍏 Build macOS App (Intel & Apple Silicon M-Series)
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Enable Rosetta and Prepare Apple Native ICNS Icon
        run: |
          # Install Rosetta 2 for seamless cross-compilation on Apple Silicon runners
          if [ "$(uname -m)" = "arm64" ]; then
            softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
          fi

          mkdir -p build/icon.iconset
          sips -z 16 16     public/logo-512.png --out build/icon.iconset/icon_16x16.png || true
          sips -z 32 32     public/logo-512.png --out build/icon.iconset/icon_16x16@2x.png || true
          sips -z 32 32     public/logo-512.png --out build/icon.iconset/icon_32x32.png || true
          sips -z 64 64     public/logo-512.png --out build/icon.iconset/icon_32x32@2x.png || true
          sips -z 128 128   public/logo-512.png --out build/icon.iconset/icon_128x128.png || true
          sips -z 256 256   public/logo-512.png --out build/icon.iconset/icon_128x128@2x.png || true
          sips -z 256 256   public/logo-512.png --out build/icon.iconset/icon_256x256.png || true
          sips -z 512 512   public/logo-512.png --out build/icon.iconset/icon_256x256@2x.png || true
          sips -z 512 512   public/logo-512.png --out build/icon.iconset/icon_512x512.png || true
          iconutil -c icns build/icon.iconset -o build/icon.icns || true

      - name: Package macOS Multi-Architecture Binaries (Intel x64 & Apple Silicon arm64)
        run: |
          mkdir -p artifacts

          # 1. Build Apple Silicon (arm64 - native architecture of GitHub macos-14 runner)
          npx electron-builder --mac --arm64 -c.mac.identity=null -c.mac.forceCodeSigning=false -c.dmg.sign=false --publish never || true

          # 2. Build Intel Mac (x64)
          npx electron-builder --mac --x64 -c.mac.identity=null -c.mac.forceCodeSigning=false -c.dmg.sign=false --publish never || true

          # 3. Create guaranteed native .zip application bundles using macOS ditto
          if [ -d "dist-electron/mac/Somiti 360.app" ]; then
            ditto -c -k --keepParent "dist-electron/mac/Somiti 360.app" "artifacts/Somiti-360-Mac-Intel-x64.zip" || true
          fi
          if [ -d "dist-electron/mac-arm64/Somiti 360.app" ]; then
            ditto -c -k --keepParent "dist-electron/mac-arm64/Somiti 360.app" "artifacts/Somiti-360-Mac-AppleSilicon-M-Series-arm64.zip" || true
          fi

          # 4. Search and collect any generated DMGs and ZIPs
          find dist-electron -name "*.dmg" -exec cp {} artifacts/ \; 2>/dev/null || true
          find dist-electron -name "*.zip" -exec cp {} artifacts/ \; 2>/dev/null || true

          # 5. Standardize friendly artifact names
          for f in artifacts/*arm64*.dmg; do
            if [ -f "$f" ] && [ "$f" != "artifacts/Somiti-360-Mac-AppleSilicon-M-Series-arm64.dmg" ]; then
              cp "$f" "artifacts/Somiti-360-Mac-AppleSilicon-M-Series-arm64.dmg" || true
            fi
          done

          for f in artifacts/*.dmg; do
            if [ -f "$f" ] && [[ "$f" != *"arm64"* ]] && [ "$f" != "artifacts/Somiti-360-Mac-Intel-x64.dmg" ]; then
              cp "$f" "artifacts/Somiti-360-Mac-Intel-x64.dmg" || true
            fi
          done

          echo "=== Generated macOS Artifacts in artifacts/ ==="
          ls -lh artifacts/

      - name: Backup Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-macOS-Apps
          path: |
            artifacts/*.dmg
            artifacts/*.zip
          if-no-files-found: warn
          retention-days: 7

  publish-all-releases:
    name: 🚀 Publish Unified Multi-Platform Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos]
    if: always() && !cancelled()
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Android-APK
          path: all-releases

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Windows-EXE
          path: all-releases

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-macOS-Apps
          path: all-releases

      - name: Display All Collected Release Binaries
        run: |
          mkdir -p all-releases
          echo "=== All Collected Platform Binaries for GitHub Release ==="
          ls -lh all-releases/

      - name: Publish Unified Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Somiti 360 Unified Multi-Platform Release (v2.2.0)"
          body: |
            ### 🛡️ সমিতি ৩৬০ (Somiti 360) সর্বজনীন মাল্টি-প্ল্যাটফর্ম রিলিজ (v2.2.0, Build 22)
            সুপার অ্যাডমিন মাল্টি-টেন্যান্ট ফিচার টগল কন্ট্রোল টাওয়ার, সমিতি অ্যাডমিন আরবিএসি (RBAC) রোল-পারমিশন কন্ট্রোল, ডুয়াল-মোড ওয়ার্কস্পেস, নিরাপদ টেন্যান্ট ডেটা আইসোলেশন, কিউআর ভেরিফিকেশন এবং অটোমেটিক ইন-অ্যাপ ওটিএ (OTA) আপডেট ইঞ্জিন।

            | প্ল্যাটফর্ম (Platform) | ফাইল নেম (File Name) | বিবরণ |
            | :--- | :--- | :--- |
            | 📱 **Android Mobile** | `Somiti-360.apk` / `Somiti-360-v2.2.0-build22-android.apk` | স্মার্টফোনে সরাসরি ডাউনলোড ও ইন্সটল করুন |
            | 💻 **Windows PC Setup** | `Somiti-360-Setup.exe` | উইন্ডোজ পিসি অ্যাপ ইন্সটলার |
            | ⚡ **Windows Portable** | `Somiti-360-PC.exe` | পোর্টেবল উইন্ডোজ অ্যাপ |
            | 🍏 **MacBook Apple Silicon** | `Somiti-360-Mac-AppleSilicon-M-Series-arm64.dmg` / `.zip` | M1/M2/M3/M4 ম্যাকবুক অ্যাপ |
            | 🍏 **MacBook Intel** | `Somiti-360-Mac-Intel-x64.dmg` / `.zip` | ইন্টেল ম্যাকবুক অ্যাপ |

            > **ম্যাক ব্যবহারকারীদের জন্য সহজ নির্দেশিকা:** আনসাইন্ড ম্যাক অ্যাপ চালানোর জন্য টার্মিনালে `xattr -cr /Applications/Somiti\ 360.app` রান করুন।
          fail_on_unmatched_files: false
          files: all-releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
