name: Build Somiti 360 Multi-Platform Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target:
        description: 'বিল্ড টার্গেট নির্বাচন করুন (Select build target)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - windows
          - macos

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: ⚡ Fast Web Build & Vercel Connection Verification
  # -------------------------------------------------------------
  web-sync-verify:
    name: 🌐 Verify Web Build & Vercel Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Verify Live Vercel Connectivity
        run: |
          echo "Pinging Somiti 360 Production Vercel Domain: https://somiti360.vercel.app"
          curl -sI https://somiti360.vercel.app | head -n 5 || true

  # -------------------------------------------------------------
  # Job 2: 📱 Build Android APK (Capacitor Native App)
  # -------------------------------------------------------------
  build-android:
    name: 📱 Build Android APK
    needs: [web-sync-verify]
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK 36 Platform
        run: |
          echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" || true

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Copy Web Assets into Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/
          chmod +x android/gradlew
          mkdir -p ~/.android
          cp android/app/debug.keystore ~/.android/debug.keystore || true
          sed -i 's|\.\./\.\./node_modules|\.\./node_modules|g' android/capacitor.settings.gradle || true

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle_build.log 2>&1 || (tail -n 60 gradle_build.log && exit 1)

      - name: Prepare Dynamic Versioned APK Assets
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          BUILD_NUM=$(grep 'versionCode' android/app/build.gradle | head -1 | tr -dc '0-9')
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Somiti-360.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/Somiti-360-v${APP_VER}-build${BUILD_NUM}-android.apk"
          echo "Built APK: Somiti-360-v${APP_VER}-build${BUILD_NUM}-android.apk"

      - name: Backup Upload Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Android-APK
          path: artifacts/*.apk
          retention-days: 7

  # -------------------------------------------------------------
  # Job 3: 💻 Build Windows PC Desktop App (.exe)
  # -------------------------------------------------------------
  build-windows:
    name: 💻 Build Windows PC Desktop App
    needs: [web-sync-verify]
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Package Native Windows Electron App & Launcher
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          try {
            npx electron-builder --win --publish never
            if (Test-Path "dist-electron\*.exe") {
              Copy-Item "dist-electron\*.exe" "artifacts\Somiti-360-Setup.exe" -Force
            }
          } catch {
            Write-Host "Electron builder fallback"
          }
          Compress-Archive -Path dist\* -DestinationPath src-desktop\app.zip -Force
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /resource:src-desktop\app.zip,app.zip /out:artifacts\Somiti-360-PC.exe src-desktop\Program.cs /reference:System.IO.Compression.dll,System.IO.Compression.FileSystem.dll,System.Windows.Forms.dll,System.Drawing.dll

      - name: Backup Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Windows-EXE
          path: artifacts/*.exe
          retention-days: 7

  # -------------------------------------------------------------
  # Job 4: 🍏 Build macOS App (Intel & Apple Silicon M-Series)
  # -------------------------------------------------------------
  build-macos:
    name: 🍏 Build macOS App (Intel & Apple Silicon M-Series)
    needs: [web-sync-verify]
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'macos'
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Build Universal macOS Binaries (arm64 + x64)
        run: |
          mkdir -p artifacts
          echo "Starting macOS build for both Apple Silicon (arm64) and Intel (x64)..."
          
          npx electron-builder --mac --arm64 --x64 --publish never || true

          # Create ZIP bundles for portable gatekeeper bypass
          if [ -d "dist-electron/mac/Somiti 360.app" ]; then
            ditto -c -k --keepParent "dist-electron/mac/Somiti 360.app" "artifacts/Somiti-360-Mac-Intel-x64.zip" || true
          fi

          if [ -d "dist-electron/mac-arm64/Somiti 360.app" ]; then
            ditto -c -k --keepParent "dist-electron/mac-arm64/Somiti 360.app" "artifacts/Somiti-360-Mac-AppleSilicon-M-Series-arm64.zip" || true
          fi

          # Search and collect any generated DMGs and ZIPs
          find dist-electron -name "*.dmg" -exec cp {} artifacts/ \; 2>/dev/null || true
          find dist-electron -name "*.zip" -exec cp {} artifacts/ \; 2>/dev/null || true

          # Standardize friendly artifact names
          for f in artifacts/*arm64*.dmg; do
            if [ -f "$f" ] && [ "$f" != "artifacts/Somiti-360-Mac-AppleSilicon-M-Series-arm64.dmg" ]; then
              cp "$f" "artifacts/Somiti-360-Mac-AppleSilicon-M-Series-arm64.dmg" || true
            fi
          done

          for f in artifacts/*.dmg; do
            if [ -f "$f" ] && [[ "$f" != *"arm64"* ]] && [ "$f" != "artifacts/Somiti-360-Mac-Intel-x64.dmg" ]; then
              cp "$f" "artifacts/Somiti-360-Mac-Intel-x64.dmg" || true
            fi
          done

          echo "=== Generated macOS Artifacts in artifacts/ ==="
          ls -lh artifacts/

      - name: Backup Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-macOS-Apps
          path: |
            artifacts/*.dmg
            artifacts/*.zip
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------
  # Job 5: 🚀 Publish Unified Multi-Platform Release
  # -------------------------------------------------------------
  publish-all-releases:
    name: 🚀 Publish Unified Multi-Platform Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos]
    if: always() && !cancelled()
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Android-APK
          path: all-releases

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-Windows-EXE
          path: all-releases

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Somiti-360-macOS-Apps
          path: all-releases

      - name: Determine Dynamic Version and Publish Release
        run: |
          mkdir -p all-releases
          APP_VER=$(node -p "require('./package.json').version")
          BUILD_NUM=$(grep 'versionCode' android/app/build.gradle | head -1 | tr -dc '0-9')
          echo "APP_VERSION=v${APP_VER}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          echo "=== All Collected Platform Binaries ==="
          ls -lh all-releases/

      - name: Publish Unified Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Somiti 360 Unified Multi-Platform Release (${{ env.APP_VERSION }})"
          body: |
            ### 🛡️ সমিতি ৩৬০ (Somiti 360) সর্বজনীন মাল্টি-প্ল্যাটফর্ম রিলিজ (${{ env.APP_VERSION }}, Build ${{ env.BUILD_NUMBER }})
            সেন্ট্রাল প্রোডাকশন ডোমেন: https://somiti360.vercel.app
            লোগো, সদস্য ছবি ও হেডার প্যাড পার্মানেন্ট ক্লাউড সিঙ্ক এবং ইউনিভার্সাল এপিআই গেটওয়ে সক্রিয়।

            | প্ল্যাটফর্ম (Platform) | ফাইল নেম (File Name) | বিবরণ |
            | :--- | :--- | :--- |
            | 📱 **Android Mobile** | `Somiti-360.apk` / `Somiti-360-${{ env.APP_VERSION }}-build${{ env.BUILD_NUMBER }}-android.apk` | স্মার্টফোনে সরাসরি ডাউনলোড ও ইন্সটল করুন |
            | 💻 **Windows PC Setup** | `Somiti-360-Setup.exe` | উইন্ডোজ পিসি অ্যাপ ইন্সটলার |
            | ⚡ **Windows Portable** | `Somiti-360-PC.exe` | পোর্টেবল উইন্ডোজ অ্যাপ |
            | 🍏 **MacBook Apple Silicon** | `Somiti-360-Mac-AppleSilicon-M-Series-arm64.dmg` / `.zip` | M1/M2/M3/M4 ম্যাকবুক অ্যাপ |
            | 🍏 **MacBook Intel** | `Somiti-360-Mac-Intel-x64.dmg` / `.zip` | ইন্টেল ম্যাকবুক অ্যাপ |

            > **ম্যাক ব্যবহারকারীদের জন্য সহজ নির্দেশিকা:** আনসাইন্ড ম্যাক অ্যাপ চালানোর জন্য টার্মিনালে `xattr -cr /Applications/Somiti\ 360.app` রান করুন।
          fail_on_unmatched_files: false
          files: all-releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
